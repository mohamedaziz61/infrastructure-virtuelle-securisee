global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/rules.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # node_exporter runs in the host netns of srv01; UFW restricts :9100 to the docker subnet
  - job_name: node-srv01
    static_configs: [{targets: ["192.168.20.10:9100"], labels: {instance: srv01, vlan: "20"}}]

  - job_name: windows-cli01
    static_configs: [{targets: ["192.168.10.50:9182"], labels: {instance: cli01, vlan: "10"}}]

  - job_name: labapp
    metrics_path: /metrics
    static_configs: [{targets: ["192.168.20.10:8080"], labels: {instance: labapp}}]

  - job_name: pfsense-snmp
    static_configs: [{targets: ["192.168.20.1"], labels: {instance: fw01}}]
    metrics_path: /snmp
    params: {module: [if_mib, hrSystem], auth: [lab_v2]}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {target_label: __address__, replacement: "snmp:9116"}

  - job_name: blackbox-icmp
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: [192.168.20.1, 192.168.30.10]   # cli01 refuses ICMP except from its gateway (by design); availability = up{job="windows-cli01"}
    relabel_configs: &bb
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}

  - job_name: blackbox-tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ["192.168.30.10:445", "192.168.30.10:443", "192.168.20.10:8080"]
    relabel_configs: *bb

  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://192.168.20.10:8080/health"]
    relabel_configs: *bb
