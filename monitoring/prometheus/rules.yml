groups:
  - name: lab
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.job }} / {{ $labels.instance }} injoignable"}
      - alert: ServiceProbeFailed
        expr: probe_success == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Sonde {{ $labels.instance }} en échec"}
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "RAM > 90 % sur {{ $labels.instance }}"}
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) > 0.85
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Disque > 85 % sur {{ $labels.instance }} {{ $labels.mountpoint }}"}
