# Monitoring stack on srv01 (VLAN 20). Prometheus is NOT published (localhost only);
# Grafana is published on BIND_IP and reachable only from MGMT/VPN (pfSense + DOCKER-USER rules).
name: monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [mon]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      retries: 5

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
    secrets: [grafana_admin]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["${BIND_IP:-127.0.0.1}:3000:3000"]
    networks: [mon]
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--web.listen-address=:9100"]
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    volumes: ["./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    cap_add: [NET_RAW]
    networks: [mon]

  snmp:
    image: prom/snmp-exporter:v0.29.0
    restart: unless-stopped
    command: ["--config.file=/etc/snmp_exporter/snmp.yml", "--config.file=/etc/snmp_exporter/auth.yml"]
    volumes: ["./snmp/auth.yml:/etc/snmp_exporter/auth.yml:ro"]
    networks: [mon]

networks:
  mon: {}

volumes:
  prom_data: {}
  grafana_data: {}

secrets:
  grafana_admin:
    file: ./secrets/grafana_admin.txt
